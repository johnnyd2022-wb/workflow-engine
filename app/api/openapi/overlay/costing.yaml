  costing_edit_purchase_allocations:
    summary: Edit purchase allocations
  costing_export_stock_snapshot:
    summary: Export stock snapshot
  costing_get_accounts:
    summary: Get accounts
  costing_get_bridge:
    summary: Get bridge
    description: >-
      Reconcile the stock value between two snapshots. The roll-forward dates stock removals by when they were
      posted to inventory (`stock_removal_date_basis`), so an invoice dated in an earlier month can appear there
      in margins while the stock leaves in a later bridge period.
  costing_get_material_history:
    summary: Get material history
  costing_get_settings:
    summary: Get settings
  costing_get_stock_snapshot:
