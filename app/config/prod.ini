[app]
environment = production
debug = false
host = 0.0.0.0
port = 8000

[database]
host = host.docker.internal
port = 5432
name = workflow-engine
user = workflow_rw
# The database password comes from the deployment environment, NOT this tracked
# file: set POSTGRES_PASSWORD from the secret store. App startup fails if unset.
password =

[xero]
client_id = 
client_secret = 

[email]
sender_email = 
receiver_email = 

[features]
invoice_button_enabled = false
schedule_enabled = false
crm_enabled = true
compliant_enabled = true
workflow_engine_enabled = true
# Enables Cases for every organisation in this environment.
operational_cases_enabled = true

[observability]
grafana_data_enabled = false
posthog_data_enabled = false
log_level = INFO
log_format = json
# No production collectors exist yet, so both pipelines stay off. Inside the container `localhost`
# is the container itself (and :8000 is this app), so the loopback endpoints below can never
# collect anything. To turn a pipeline on: point its endpoints at a real collector, THEN set the
# switch (tests/test_prod_config_observability.py enforces that order) and the matching
# grafana_data_enabled / posthog_data_enabled consent flag above.
otel_enabled = false
otel_service_name = workflow-engine
otel_sample_rate = 0.1
otel_exporter_endpoint = http://localhost:4317
otel_exporter_protocol = grpc
otel_capture_metrics = true
rum_enabled = false
rum_collector_url = /telemetry
rum_sample_rate = 1.0
rum_mask_inputs = true
rum_faro_upstream = http://localhost:12347
rum_posthog_upstream = http://localhost:8000
rum_posthog_api_key =

[docker]
enabled = false
container_name = workflow-engine-prod-db
image_name = postgres
host_port = 8432
container_port = 5432

[google_sign_in]
# Requires OAuth credentials from KeePassXC locally or protected environment variables.
enabled = true
redirect_uri = https://biz-e.app/auth/google/callback
keepass_client_id_entry = workflow-engine/google/client_id
keepass_client_secret_entry = workflow-engine/google/client_secret
