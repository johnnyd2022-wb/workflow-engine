<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="robots" content="noindex">
  <title>{% block title %}Biz-E{% endblock %}</title>
  <script nonce="{{ csp_nonce() }}">
    try { if (localStorage.getItem('spa-theme') === 'dark') document.documentElement.setAttribute('data-spa-theme', 'dark'); } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f7f9fa; --card: #ffffff; --text: #172033; --muted: #5d6778; --border: #dce4e9;
      --accent: #175c52; --accent-hover: #0f766e; --on-accent: #ffffff;
      --soft: #eef6f4; --warn-bg: #fff4e5; --warn-text: #8a4b00; --danger: #a23421; --danger-bg: #fdeceb;
    }
    html[data-spa-theme="dark"] {
      color-scheme: dark;
      --bg: #101a25; --card: #17232f; --text: #e5eef6; --muted: #a9b8c6; --border: #2c3d4b;
      --accent: #5eead4; --accent-hover: #99f6e4; --on-accent: #08231f;
      --soft: #13202b; --warn-bg: #3a2a10; --warn-text: #fdb022; --danger: #f97066; --danger-bg: #3a1d1a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 34rem; margin: 0 auto; padding: 32px 20px 56px; }
    .brand { font-weight: 700; letter-spacing: .01em; color: var(--accent); margin: 0 0 20px; }
    .card { --pad-x: 24px; --pad-y: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: var(--pad-y) var(--pad-x); box-shadow: 0 2px 8px rgb(15 23 42 / 6%); overflow-wrap: anywhere; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 8px; }
    h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .badge { display: inline-block; font-size: .8125rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-text); vertical-align: middle; }
    .who { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 18px 0 0; }
    .who strong { display: block; }
    fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
    .choice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .choice input { margin-top: 5px; accent-color: var(--accent); }
    .choice.is-off { opacity: .6; }
    .choice .name { font-weight: 600; display: block; }
    .choice .hint { color: var(--muted); font-size: .9375rem; }
    ul.covers { margin: 0; padding-left: 20px; }
    ul.covers li { margin: 0 0 6px; }
    /* The decision stays on screen however long the list above it is: it sticks to the bottom of the
       viewport and ends the card. */
    .actions { display: grid; gap: 10px; position: sticky; bottom: 0; margin: 24px calc(-1 * var(--pad-x)) calc(-1 * var(--pad-y));
      padding: 16px var(--pad-x) 20px; background: var(--card); border-top: 1px solid var(--border); border-radius: 0 0 16px 16px; }
    button { font: inherit; font-weight: 600; border-radius: 12px; padding: 14px 18px; cursor: pointer; width: 100%; min-height: 48px; }
    .primary { background: var(--accent); color: var(--on-accent); border: 0; }
    .primary:hover { background: var(--accent-hover); }
    .secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .secondary:hover { background: var(--soft); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .notice { border-radius: 12px; padding: 14px 16px; background: var(--danger-bg); color: var(--danger); font-weight: 500; margin: 18px 0 0; }
    .fine { font-size: .875rem; color: var(--muted); margin-top: 20px; }
    .badges { margin: 0 0 8px; }
    .badge.is-verified { background: var(--soft); color: var(--accent); border: 1px solid var(--border); }
    @media (min-width: 640px) { main { padding-top: 48px; } .card { --pad-x: 36px; --pad-y: 32px; } .actions { grid-template-columns: 1.8fr 1fr; } }
  </style>
</head>
<body>
<main>
  <p class="brand">Biz-E</p>
  <div class="card">
    {% block body %}{% endblock %}
  </div>
</main>
</body>
</html>
