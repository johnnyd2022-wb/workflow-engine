{% extends "shared/base_spa.html" %}
{% block title %}Tasks{% endblock %}

{% block content %}
<div class="max-content core-tasks" x-data="coreTasksBoard()" x-init="init()">
  <section class="card spa-primary-flat core-tasks__hero">
    <div class="core-tasks__heading">
      <div><h1>Tasks</h1><p>Plan operational work alongside CRM follow-ups.</p></div>
      <div class="core-tasks__heading-actions">
        <a href="/core/tasks/configuration" class="btn btn-secondary" hx-boost="false">Task settings</a>
        <button type="button" class="btn btn-primary" @click="openCreate()">New task</button>
      </div>
    </div>

    <div class="core-tasks__upcoming" aria-label="Upcoming task dates">
      <button type="button" class="core-tasks__date" :class="{active: selectedDate === ''}" @click="selectedDate = ''">All</button>
      <template x-for="day in upcomingDays" :key="day.iso">
        <button type="button" class="core-tasks__date" :class="{active: selectedDate === day.iso, today: day.isToday}" @click="selectedDate = selectedDate === day.iso ? '' : day.iso">
          <span x-text="day.label"></span><strong x-text="day.number"></strong><em x-show="tasksDueOn(day.iso)" x-text="tasksDueOn(day.iso)"></em>
        </button>
      </template>
    </div>

    <div class="core-tasks__filters">
      <input type="search" class="form-input" placeholder="Search tasks" x-model="searchQuery">
      <select class="form-select" x-model="sourceFilter" aria-label="Task source">
        <option value="all">All task sources</option><option value="core">System tasks</option><option value="crm">CRM tasks</option>
      </select>
      <select class="form-select" x-model="assigneeFilter" aria-label="Assignee">
        <option value="">All assignees</option>
        <template x-for="user in users" :key="user.id"><option :value="user.id" x-text="user.display_name || user.email"></option></template>
      </select>
      <label class="core-tasks__toggle"><input type="checkbox" x-model="onlyAssigned"> Assigned only</label>
      <button type="button" class="btn btn-secondary" @click="openLaneModal()" :disabled="!canAddLane">Add lane</button>
    </div>
  </section>

  <p class="core-tasks__error" x-show="error" x-text="error" x-cloak></p>
  <div class="core-tasks__loading" x-show="loading">Loading tasks…</div>

  <section class="core-tasks__board" x-show="!loading" :style="{'--lane-count': visibleLanes.length}">
    <template x-for="lane in visibleLanes" :key="lane.id">
      <div class="core-tasks__lane" @dragover.prevent="dragOverLane = lane.id" @drop.prevent="dropInLane(lane)" :class="{'drop-target': dragOverLane === lane.id}">
        <header><h2 x-text="lane.title"></h2><span x-text="tasksForLane(lane).length"></span><div class="core-tasks__lane-actions" x-show="lane.custom"><button type="button" @click="moveLane(lane, -1)" aria-label="Move lane left" title="Move lane left">←</button><button type="button" @click="moveLane(lane, 1)" aria-label="Move lane right" title="Move lane right">→</button><button type="button" @click="renameLane(lane)" aria-label="Rename lane" title="Rename lane">✎</button><button type="button" @click="removeLane(lane.id)" aria-label="Remove lane" title="Remove lane">×</button></div></header>
        <div class="core-tasks__lane-body">
          <template x-for="task in tasksForLane(lane)" :key="task.key">
            <article class="core-tasks__card" :class="{'core-tasks__card--crm': task.source === 'crm'}" :draggable="task.editable" @dragstart="startDrag(task)" @dragend="dragOverLane = ''" @click="openTask(task)">
              <div class="core-tasks__card-top"><span class="core-tasks__source" x-text="task.source_label"></span><span class="core-tasks__priority" :class="'priority-' + task.priority" x-text="task.priority"></span></div>
              <h3 x-text="task.title"></h3>
              <p x-show="task.description" x-text="task.description"></p>
              <footer><span :class="{'overdue': isOverdue(task)}" x-text="dueLabel(task)"></span><span x-text="task.assigned_to_name || 'Unassigned'"></span></footer>
            </article>
          </template>
          <p class="core-tasks__empty" x-show="tasksForLane(lane).length === 0">No tasks</p>
        </div>
      </div>
    </template>
  </section>

  <div class="core-tasks__modal" x-show="showDrawer" x-cloak @click.self="closeDrawer()">
    <form class="core-tasks__dialog" @submit.prevent="saveTask()">
      <header><h2 x-text="editingTask ? 'Edit task' : 'New task'"></h2><button type="button" @click="closeDrawer()">×</button></header>
      <label>Title<input class="form-input" required maxlength="500" x-model="form.title"></label>
      <label>Notes (optional)<textarea class="form-input" rows="4" maxlength="20000" x-model="form.description"></textarea></label>
      <div class="core-tasks__dialog-grid"><label>Due date<input class="form-input" type="date" x-model="form.due_date"></label><label>Priority<select class="form-select" x-model="form.priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label></div>
      <div class="core-tasks__dialog-grid"><label>Assign to<select class="form-select" x-model="form.assigned_to_user_id"><option value="">Unassigned</option><template x-for="user in activeUsers" :key="user.id"><option :value="user.id" x-text="user.display_name || user.email"></option></template></select></label><label>Status<select class="form-select" x-model="form.status"><option value="pending">To do</option><option value="in_progress">In progress</option><option value="completed">Done</option><option value="cancelled">Cancelled</option></select></label></div>
      <p class="core-tasks__readonly" x-show="editingTask && !editingTask.editable">CRM tasks are managed from CRM so their customer context is retained.</p>
      <footer><button type="button" class="btn btn-secondary" x-show="editingTask && editingTask.editable" @click="deleteTask()">Delete</button><span></span><button type="button" class="btn btn-secondary" @click="closeDrawer()">Cancel</button><button type="button" class="btn btn-primary" x-show="editingTask && !editingTask.editable" @click="openCrmTask()">Open in CRM</button><button class="btn btn-primary" x-show="!editingTask || editingTask.editable" :disabled="saving" x-text="saving ? 'Saving…' : 'Save task'"></button></footer>
    </form>
  </div>

  <div class="core-tasks__modal" x-show="showLaneModal" x-cloak @click.self="showLaneModal = false">
    <form class="core-tasks__dialog core-tasks__dialog--small" @submit.prevent="saveLane()"><header><h2>Add lane</h2><button type="button" @click="showLaneModal = false">×</button></header><label>Lane name<input class="form-input" required maxlength="80" x-model="laneTitle"></label><footer><span></span><button type="button" class="btn btn-secondary" @click="showLaneModal = false">Cancel</button><button class="btn btn-primary">Add lane</button></footer></form>
  </div>
</div>
{% endblock %}
