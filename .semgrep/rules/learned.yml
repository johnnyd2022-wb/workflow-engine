# Rules born from findings — the learning loop's output.
#
# Every rule here started life as a vulnerability or defect an agent (or human) found by
# reading code. Once validated, it became a deterministic check so the NEXT occurrence is
# caught by machine, not by hoping someone reads carefully. This is the AER North Star made
# concrete: each validated insight becomes permanent engineering capability, and the need
# for LLM reasoning over that class drops to zero.
#
# Contract for every rule in this file (enforced by scripts/rule_candidates.py):
#   1. carry a `metadata:` block with `born-from`, `finding`, `date`, and `fixture`
#   2. have a paired fixture under .semgrep/fixtures/<fixture>/ with vulnerable.* + fixed.*
#   3. FIRE on vulnerable.* and stay SILENT on fixed.* — a rule that never fired on the
#      real bug is untested, and an untested rule is a false sense of security
#
# Add rules here via `python scripts/rule_candidates.py scaffold --id <rule-id>`, then
# prove them with `python scripts/rule_candidates.py verify`.

rules:
  - id: bize-mass-assignment-from-request
    languages: [python]
    severity: ERROR
    message: >
      Mass assignment: a model is constructed by splatting the request body
      (Model(**request.json)). A client can then set any column, including ones it should
      never control (org_id, is_admin, id). Bind an explicit allowlist of fields instead:
      User(email=data["email"], name=data["name"]).
    metadata:
      born-from: security-audit
      finding: "security-audit checklist item 3 (mass assignment) had no scanner rule — a reader had to catch it every time"
      date: "2026-07-19"
      fixture: bize-mass-assignment-from-request
      references:
        - https://owasp.org/www-community/attacks/Mass_Assignment
    patterns:
      - pattern-either:
          - pattern: $MODEL(**request.json)
          - pattern: $MODEL(**request.get_json(...))
      # the callable is a model class, not an arbitrary helper: CapWord name
      - metavariable-regex:
          metavariable: $MODEL
          regex: "^[A-Z][A-Za-z0-9]+$"

  - id: bize-verbose-error-to-client
    languages: [python]
    severity: ERROR
    message: >
      An exception's str() is being interpolated directly into a jsonify() response body.
      This can leak internal detail — raw DB driver messages, file paths, SQL fragments —
      through an API error sent to the client. Log the exception server-side only
      (logger.exception("...")) and return a fixed, generic error message to the client.
    metadata:
      born-from: security-audit
      finding: "org_routes.py's update_org/list_users/delete_user exception handlers
        returned jsonify({'error': f'...: {str(e)}'}) — verbose internal error text sent
        straight to the API client instead of being logged server-side only"
      date: "2026-07-26"
      fixture: bize-verbose-error-to-client
      note: >
        Narrowed 2026-07-26 to require the interpolation inside a jsonify(...) call —
        the original pattern (any f-string with {e}/{str(e)} inside an except block)
        false-positived on logger.error(f"...{e}...") and print(f"...{e}...") calls
        elsewhere in the app that never reach a client response at all.
    patterns:
      - pattern-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-inside: jsonify(...)
      - pattern-either:
          - pattern: f"...{$E}..."
          - pattern: f"...{str($E)}..."
          - pattern: '"...".format($E)'
          - pattern: '"..." + str($E)'

  - id: bize-session-clear-without-rotate
    languages: [python]
    severity: WARNING
    message: >
      session.clear() here is not immediately followed by session.permanent = True, and
      isn't inside the shared rotate_session() helper. session.clear() wipes every
      session key — including the internal `_permanent` key that backs
      session.permanent — so a hand-rolled clear() + manual key restore silently
      downgrades a persistent (long-lived) session cookie to a browser-session-only one.
      Call the shared rotate_session() helper (which clears AND re-sets
      session.permanent = True) instead of session.clear() directly when rotating an
      authenticated session (login, 2FA verify, password change, etc).
    metadata:
      born-from: security-audit
      finding: "auth security audit F2: app/api/routes/auth_routes.py's change_password()
        rotated the session with a bare session.clear() + manual per-key restore instead
        of the shared rotate_session() helper used by login/signup/verify-2fa, dropping
        session.permanent (stored as the `_permanent` session key) and silently
        downgrading the post-password-change cookie from persistent to
        browser-session-only."
      date: "2026-07-26"
      fixture: bize-session-clear-without-rotate
    patterns:
      - pattern: session.clear()
      - pattern-not-inside: |
          session.clear()
          session.permanent = ...
      - pattern-not-inside: |
          def rotate_session(...):
              ...

  - id: bize-decimal-compare-without-finite-guard
    languages: [python]
    severity: WARNING
    message: >
      This Decimal is ordering-compared (< > <= >=) without a preceding is_finite()
      guard. Decimal("NaN") < 0 raises decimal.InvalidOperation, which is NOT a subclass
      of ValueError — so a route whose only handler is `except ValueError` lets it escape
      as an unlogged, non-JSON 500 instead of the 400 a bad client value deserves. Check
      `not value.is_finite()` BEFORE any ordering comparison (is_finite() is False for
      both NaN and Infinity), or funnel the value through
      app/core/utils/inventory_quantity.coerce_stored_quantity, which already does.
    metadata:
      born-from: security-audit
      finding: "inventory security audit F2: adjust_inventory_item_quantity validated with
        float(), and float('nan') <= 0 is False, so 'nan' passed the route gate. The
        repository then evaluated Decimal('NaN') < 0, raising InvalidOperation past the
        route's ValueError-only handler — a 500 with no structured log line. F3 was the
        same root cause one layer down: Decimal('1e400').quantize() raising outside
        coerce_stored_quantity's try."
      date: "2026-07-28"
      fixture: bize-decimal-compare-without-finite-guard
    patterns:
      - pattern-either:
          - pattern: $D < $N
          - pattern: $D > $N
          - pattern: $D <= $N
          - pattern: $D >= $N
      - pattern-inside: |
          $D = Decimal(...)
          ...
      - pattern-not-inside: |
          ...
          if <... $D.is_finite() ...>:
              ...
      - pattern-not-inside: |
          if <... not $D.is_finite() ...>:
              ...
      # Handling the raise is the other legitimate way to write this, so a comparison
      # sitting inside ANY try/except is out of scope for this rule. That keeps it aimed
      # at the shape both real findings actually had — an inline parse compared with no
      # exception handling at all — instead of guessing which handlers are broad enough.
      - pattern-not-inside: |
          try:
              ...
          except $EXC:
              ...
      - pattern-not-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-not-inside: |
          try:
              ...
          except (...):
              ...
